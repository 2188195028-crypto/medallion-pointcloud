<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>繁荣昌盛 · FOUR SEASONS MEDALLION 点云展陈</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="showcase.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "./assets/three/three.module.js",
      "three/addons/": "./assets/three/"
    }
  }
  </script>
</head>
<body>
  <main id="app">
    <!-- 3D 点云画布 -->
    <div id="stage" aria-hidden="true"><canvas id="scene"></canvas></div>

    <!-- 左侧博物馆图录式器物介绍 -->
    <section id="text-panel" aria-label="器物介绍">
      <p id="category"></p>
      <h1 id="title"></h1>
      <p id="alias"></p>
      <p id="intro"></p>
      <p id="intro-sub"></p>

      <!-- 正文（打字机效果） -->
      <div id="body-wrap">
        <p id="body"></p>
        <span id="cursor" aria-hidden="true"></span>
      </div>

      <!-- 特征词 -->
      <ul id="features" aria-label="特征词"></ul>

      <!-- 主要颜色与工艺线索 -->
      <div id="meta">
        <div id="palette-wrap" class="meta-block">
          <span class="meta-label">主要颜色</span>
          <ul id="palette" aria-label="主要颜色"></ul>
        </div>
        <div id="tags-wrap" class="meta-block">
          <span class="meta-label">工艺线索</span>
          <ul id="tags" aria-label="工艺线索"></ul>
        </div>
      </div>
    </section>

    <!-- 底部界面 -->
    <footer id="bottom-bar">
      <span id="counter">01 / 01</span>
      <div id="progress" role="progressbar" aria-label="展示进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="progress-fill"></div>
      </div>
      <button id="restart" type="button" aria-label="重新播放展示循环">重启</button>
    </footer>

    <!-- 加载状态 -->
    <div id="loading" role="status" aria-live="polite">
      <span>正在聚合点云…</span>
    </div>

    <!-- 错误状态（不允许黑屏） -->
    <div id="error" role="alert" hidden>
      <p id="error-msg">模型加载失败。</p>
      <button id="reload" type="button">重新加载</button>
    </div>
  </main>

  <!-- file:// 协议检测：直接双击 index.html 时 ES 模块与模型会被浏览器
       CORS 拦截导致页面卡在加载态，这里立即给出可操作的提示 -->
  <script>
    if (location.protocol === "file:") {
      document.getElementById("loading").style.display = "none";
      var err = document.getElementById("error");
      err.hidden = false;
      document.getElementById("error-msg").textContent =
        "页面需要本地服务器才能加载模型：请双击项目里的 start.bat 一键启动，或在命令行运行 python tools/serve_debug.py 8137，然后访问 http://127.0.0.1:8137/";
    }
  </script>

  <script type="module" src="showcase.js"></script>
</body>
</html>
