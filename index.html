<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>繁荣昌盛 · FOUR SEASONS MEDALLION 点云展陈</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="showcase.css" />
  <!-- three.js 模块走 jsDelivr CDN(国内加载快:Pages 实测 three.core.js 需 14s,
       jsDelivr ~2s;仓库 assets/three/ 已入库,离线开发可改回 ./assets/three/) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/gh/2188195028-crypto/medallion-pointcloud@v1.8/assets/three/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/gh/2188195028-crypto/medallion-pointcloud@v1.8/assets/three/"
    }
  }
  </script>
</head>
<body>
  <main id="app">
    <!-- 3D 点云画布 -->
    <div id="stage" aria-hidden="true"><canvas id="scene"></canvas></div>

    <!-- 左侧博物馆图录式器物介绍 -->
    <section id="text-panel" aria-label="器物介绍">
      <p id="category"></p>
      <h1 id="title"></h1>
      <p id="alias"></p>
      <p id="intro"></p>
      <p id="intro-sub"></p>

      <!-- 正文（打字机效果） -->
      <div id="body-wrap">
        <p id="body"></p>
        <span id="cursor" aria-hidden="true"></span>
      </div>

      <!-- 特征词 -->
      <ul id="features" aria-label="特征词"></ul>

      <!-- 主要颜色与工艺线索 -->
      <div id="meta">
        <div id="palette-wrap" class="meta-block">
          <span class="meta-label">主要颜色</span>
          <ul id="palette" aria-label="主要颜色"></ul>
        </div>
        <div id="tags-wrap" class="meta-block">
          <span class="meta-label">工艺线索</span>
          <ul id="tags" aria-label="工艺线索"></ul>
        </div>
        <!-- 落地实景:店面前后对比照片缩略图(点击看大图,showcase.js 注入) -->
        <div id="realwall-wrap" class="meta-block">
          <span class="meta-label">落地实景</span>
          <div id="realwall-thumbs"></div>
        </div>
      </div>
    </section>

    <!-- 落地实景擦除对比(默认隐藏,缩略图点击打开;Esc/背景/关闭钮均可关闭)
         单舞台叠两图:before 打底,after 在上层靠 mask 揭示 —— 结构由 JS 注入路径与文案 -->
    <div id="realwall-overlay" hidden role="dialog" aria-modal="true" aria-label="落地实景前后对比">
      <button id="realwall-close" type="button" aria-label="关闭实景照片">×</button>
      <figure class="realwall-stage">
        <div class="realwall-frame" id="realwall-frame">
          <img id="realwall-before" class="realwall-img realwall-img--before" alt="" />
          <img id="realwall-after" class="realwall-img realwall-img--after" alt="" />
        </div>
        <figcaption id="realwall-caption"></figcaption>
      </figure>
      <p class="realwall-hint" id="realwall-hint">滚动擦除 · 对比上墙前后</p>
    </div>

    <!-- 底部界面(仅保留编号) -->
    <footer id="bottom-bar">
      <span id="counter">01 / 01</span>
    </footer>

    <!-- 加载状态 -->
    <div id="loading" role="status" aria-live="polite">
      <span>正在聚合点云…</span>
    </div>

    <!-- 错误状态（不允许黑屏） -->
    <div id="error" role="alert" hidden>
      <p id="error-msg">模型加载失败。</p>
      <button id="reload" type="button">重新加载</button>
    </div>
  </main>

  <!-- 双击直接打开(file://)也可用:全部静态资源走 jsDelivr CDN 绝对地址,
       无需本地服务器。离线时 CDN 不可达,由看门狗给出错误提示。
       如需离线开发,仍可用 start.bat 或 python tools/serve_debug.py 8137 -->
  <script>
    // 加载看门狗:45s 内 showcase.js 未初始化(CDN 不可达/网络异常)才提示。
    // 45s 覆盖冷缓存场景(实测 jsDelivr 冷缓存 ~21s + 模块解析 ~7s ≈ 28s,
    // 25s 会误报;预热后第二次打开 ~10s)
    // ?nowatchdog=1(调试参数):跳过看门狗——发布前本地测试撞 jsDelivr 对
    // 不存在 tag 的挂起漂移(加载可被拖到 45s+)时,避免 error 面板误报遮屏
    window.__showcaseReady = false;
    var nowatchdog = location.search.indexOf("nowatchdog=1") !== -1;
    if (!nowatchdog) setTimeout(function () {
      if (!window.__showcaseReady) {
        document.getElementById("loading").style.display = "none";
        var err = document.getElementById("error");
        err.hidden = false;
        document.getElementById("error-msg").textContent =
          "页面加载较慢或网络异常，请稍候点击重新加载重试。首次加载需从 CDN 获取资源（约 10-30 秒），之后会快很多。";
      }
    }, 45000);
  </script>

  <!-- 引导:主模块 CDN 优先(国内快),失败自动重试一次再回退本地。
       showcase.js 内相对导入 ./showcase-config.js 跟随模块来源自动切换 -->
  <script type="module">
    const cdn = "https://cdn.jsdelivr.net/gh/2188195028-crypto/medallion-pointcloud@v1.8/";
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    let ok = false;
    for (let attempt = 0; attempt < 2 && !ok; attempt++) {
      try {
        await import(cdn + "showcase.js");
        ok = true;
      } catch (e) {
        console.warn("[showcase] CDN 模块加载失败(第" + (attempt + 1) + "次),重试", e.message || e);
        if (attempt === 0) await sleep(1500);
      }
    }
    if (!ok) {
      // file:// 下相对导入会被 CORS 拦截,本地回退仅对服务器场景有意义
      try { await import("./showcase.js"); } catch (e2) { console.error("[showcase] 本地加载也失败", e2); }
    }
  </script>
</body>
</html>
